slam_toolbox:
  ros__parameters:

    # TF 坐标系
    odom_frame: odom
    map_frame: map
    base_frame: base_link

    # LiDAR topic
    scan_topic: /scan

    # 建图模式
    mode: mapping

    # 地图分辨率：每个地图格子代表 5 cm
    resolution: 0.05

    # TF 查询等待时间
    transform_timeout: 0.2

    # 多久发布一次 map -> odom
    transform_publish_period: 0.05

    # 多久更新一次地图
    map_update_interval: 1.0
